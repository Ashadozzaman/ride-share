version: "3.9"

services:
    # PHP (Laravel)
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: laravel-php
        volumes:
            - ./:/var/www
        depends_on:
            - mysql
        networks:
            - laravel

    # Nginx
    nginx:
        image: nginx:latest
        container_name: laravel-nginx
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
        networks:
            - laravel

    # Node.js (Vue 3 build)
    node:
        image: node:20.18.0
        working_dir: /var/www
        volumes:
            - ./:/var/www
        command: sh -c "npm install && npm run build"
        networks:
            - laravel

    # MySQL
    mysql:
        image: mysql:8.0
        container_name: laravel-mysql
        ports:
            - "3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravel

volumes:
    dbdata:

networks:
    laravel:
